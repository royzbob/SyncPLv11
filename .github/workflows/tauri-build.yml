name: 'publish'

on:
  push:
    tags:
      - 'v*' # Trigger build whenever a new tag (e.g. v1.0.0) is pushed to GitHub
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  draft-crabnebula:
    runs-on: ubuntu-latest
    env:
      CN_API_KEY: ${{ secrets.CN_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect Project Path
        id: detect
        shell: bash
        run: |
          if [ -f "src-tauri/Cargo.toml" ]; then
            echo "project_path=." >> $GITHUB_OUTPUT
          elif [ -f "syncpl-trading-dashboard/src-tauri/Cargo.toml" ]; then
            echo "project_path=syncpl-trading-dashboard" >> $GITHUB_OUTPUT
          else
            found_path=$(find . -maxdepth 3 -name "Cargo.toml" | grep "src-tauri" | head -n 1)
            if [ ! -z "$found_path" ]; then
              dir_path=$(echo "$found_path" | sed 's|/src-tauri/Cargo.toml||' | sed 's|^\./||')
              echo "project_path=$dir_path" >> $GITHUB_OUTPUT
            else
              echo "project_path=." >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create CrabNebula Release Draft
        if: env.CN_API_KEY != ''
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release draft syncpl/syncpl --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
          path: ${{ steps.detect.outputs.project_path }}

  build-and-upload:
    needs: draft-crabnebula
    permissions:
      contents: write
    env:
      CN_API_KEY: ${{ secrets.CN_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect Project Path
        id: detect
        shell: bash
        run: |
          if [ -f "src-tauri/Cargo.toml" ]; then
            echo "Found Tauri project at root"
            echo "project_path=." >> $GITHUB_OUTPUT
            echo "npm_dir=." >> $GITHUB_OUTPUT
          elif [ -f "bitpulse-v17-desktop/src-tauri/Cargo.toml" ]; then
            echo "Found Tauri project in bitpulse-v17-desktop"
            echo "project_path=bitpulse-v17-desktop" >> $GITHUB_OUTPUT
            echo "npm_dir=bitpulse-v17-desktop" >> $GITHUB_OUTPUT
          elif [ -f "syncpl-trading-dashboard/src-tauri/Cargo.toml" ]; then
            echo "Found Tauri project in syncpl-trading-dashboard"
            echo "project_path=syncpl-trading-dashboard" >> $GITHUB_OUTPUT
            echo "npm_dir=syncpl-trading-dashboard" >> $GITHUB_OUTPUT
          else
            found_path=$(find . -maxdepth 3 -name "Cargo.toml" | grep "src-tauri" | head -n 1)
            if [ ! -z "$found_path" ]; then
              dir_path=$(echo "$found_path" | sed 's|/src-tauri/Cargo.toml||' | sed 's|^\./||')
              echo "Found Tauri project in auto-detected path: $dir_path"
              echo "project_path=$dir_path" >> $GITHUB_OUTPUT
              echo "npm_dir=$dir_path" >> $GITHUB_OUTPUT
            else
              echo "Could not auto-detect Tauri project! Defaulting to root."
              echo "project_path=." >> $GITHUB_OUTPUT
              echo "npm_dir=." >> $GITHUB_OUTPUT
            fi
          fi

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        shell: bash
        run: |
          cd ${{ steps.detect.outputs.npm_dir }}
          npm install

      - name: Build and Publish to GitHub
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # Auto-replaced with version in tauri.conf.json
          releaseName: 'SyncPL Trading Dashboard v__VERSION__'
          releaseBody: 'See the assets below to download the latest version for macOS and Windows.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          projectPath: ${{ steps.detect.outputs.project_path }}
          tauriScript: 'npm run tauri'
          args: ${{ matrix.args }}

      - name: Upload to CrabNebula Cloud
        if: env.CN_API_KEY != ''
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release upload syncpl/syncpl --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
          path: ${{ steps.detect.outputs.project_path }}

  publish-crabnebula:
    needs: build-and-upload
    runs-on: ubuntu-latest
    env:
      CN_API_KEY: ${{ secrets.CN_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect Project Path
        id: detect
        shell: bash
        run: |
          if [ -f "src-tauri/Cargo.toml" ]; then
            echo "project_path=." >> $GITHUB_OUTPUT
          elif [ -f "syncpl-trading-dashboard/src-tauri/Cargo.toml" ]; then
            echo "project_path=syncpl-trading-dashboard" >> $GITHUB_OUTPUT
          else
            found_path=$(find . -maxdepth 3 -name "Cargo.toml" | grep "src-tauri" | head -n 1)
            if [ ! -z "$found_path" ]; then
              dir_path=$(echo "$found_path" | sed 's|/src-tauri/Cargo.toml||' | sed 's|^\./||')
              echo "project_path=$dir_path" >> $GITHUB_OUTPUT
            else
              echo "project_path=." >> $GITHUB_OUTPUT
            fi
          fi

      - name: Publish CrabNebula Release
        if: env.CN_API_KEY != ''
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release publish syncpl/syncpl --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
          path: ${{ steps.detect.outputs.project_path }}
